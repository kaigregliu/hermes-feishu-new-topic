name: feishu-new-topic
label: Feishu New Topic
kind: standalone
version: 0.3.5
description: >-
  飞书里用固定的「#new 」token（或口述「开启一个新话题」）= 在当条消息上开一条新话题
  （= 新 session）。关键差别：/new 是重置，会打断主会话里正在跑的任务并清空对话；
  #new 是另开一条车道，主会话里正在跑的活照跑不误。只有这两条规则，没有转义、没有例外；
  建话题失败时降级为普通消息并附一句提示。
  Feishu/Lark only: `#new ` (or a spoken phrase) opens a new topic on that message, which Hermes
  turns into a new session, leaving the running one untouched — unlike /new, which interrupts it.
  Two trigger rules, no escape syntax; degrades to a normal message with a note on failure.
author: kai & 雪碧
requires_hermes: ">=0.22"
provides_hooks:
  - pre_gateway_dispatch
