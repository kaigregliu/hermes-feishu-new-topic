name: tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only reads the checkout.
permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Pinned to commit SHAs — a tag can be moved upstream.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}

      # The recall path builds a real DeleteMessageRequest, so the tests need
      # the Feishu SDK even though the plugin itself imports it lazily.
      - name: Install lark-oapi
        run: pip install "lark-oapi==1.6.8"

      - name: Self-test (FakeCtx, no Hermes required)
        run: python tests/test_plugin.py
