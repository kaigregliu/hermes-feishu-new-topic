name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The recall path builds a real DeleteMessageRequest, so the tests need
      # the Feishu SDK even though the plugin itself imports it lazily.
      - name: Install lark-oapi
        run: pip install lark-oapi

      - name: Self-test (FakeCtx, no Hermes required)
        run: python tests/test_plugin.py
